name: Windows Installers

on:
  workflow_dispatch:
  push:
    tags: ["spatial-v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "yarn", cache-dependency-path: frontend/yarn.lock}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: desktop/src-tauri}
      - run: yarn --cwd frontend install --frozen-lockfile
      - run: yarn --cwd frontend build
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles nsis,msi
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-ai-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi