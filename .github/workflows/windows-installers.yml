name: Windows Installers

on:
  workflow_dispatch:
  push:
    tags: ["spatial-v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "yarn", cache-dependency-path: frontend/yarn.lock}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Tesseract (bundled into the installer)
        shell: powershell
        run: choco install tesseract -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: desktop/src-tauri}
      - name: Restore signing certificate (optional)
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          "WINDOWS_CERT_PATH=$path" >> $env:GITHUB_ENV
      - name: Build NSIS + MSI (signed when a certificate is configured)
        shell: powershell
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.TIMESTAMP_URL }}
        run: .\desktop\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: point-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/signed-package-manifest.json
      - name: Extract this version's notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          version = os.environ["GITHUB_REF_NAME"].removeprefix("spatial-v")
          notes, inside = [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  heading = line[3:].split()
                  inside = bool(heading) and heading[0] == version
                  continue
              if inside:
                  notes.append(line)
          open("release-notes.md", "w", encoding="utf-8").write("".join(notes).strip())
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/signed-package-manifest.json
