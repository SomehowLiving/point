name: Windows Installers

on:
  workflow_dispatch:
  push:
    tags: ["spatial-v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "yarn", cache-dependency-path: frontend/yarn.lock}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: desktop/src-tauri}
      - name: Build, sign, and verify NSIS + MSI
        shell: powershell
        run: .\desktop\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-ai-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/signed-package-manifest.json
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/signed-package-manifest.json
