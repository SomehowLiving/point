[pytest]
# Two xdist workers; loadscope keeps each test module/class on one worker, since the API tests
# share one running backend and assume sequential state within a module. Run serially with -n 0.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope
markers =
    integration: calls a real external AI provider end-to-end; needs network + provider quota.
        Run explicitly with `pytest -m integration`. The default run (no -m filter) still collects
        these tests, but each one self-skips (not fails) if the provider responds with a quota/
        rate-limit error, so the default command never requires paid API quota to pass.
